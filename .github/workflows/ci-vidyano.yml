name: CI - Vidyano

on:
  push:
    branches:
      - v4.0
      - v5.0
    paths:
      - 'packages/vidyano/**'
      - 'dev/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tools/test/**'
      - '.npmrc'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-vidyano.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - v4.0
      - v5.0
    paths:
      - 'packages/vidyano/**'
      - 'dev/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tools/test/**'
      - '.npmrc'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-vidyano.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Build and Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      # GitHub's runner image ships Google Chrome, which channel: 'chrome' uses; act's image has none
      - name: Install Playwright browsers (act only)
        if: ${{ env.ACT }}
        run: npx playwright install --with-deps chrome

      - name: Run build
        run: npm run build

      - name: Start dev server and run tests
        run: |
          # Start server in background
          dotnet run --project dev/Dev.csproj --urls "http://0.0.0.0:5000" &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s -o /dev/null -w '%{http_code}' --head http://127.0.0.1:5000 | grep -q "200"; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          # Whole spec files per shard, balanced by their duration on CI (tools/test/shard-weights.json)
          SPECS=$(node tools/test/shard.mjs ${{ matrix.shard }} 3) || exit 1
          npm run test:vidyano -- $SPECS
          TEST_EXIT=$?

          # Stop server
          echo "Stopping server (PID: $SERVER_PID)"
          kill $SERVER_PID || true

          # Exit with test result
          exit $TEST_EXIT
