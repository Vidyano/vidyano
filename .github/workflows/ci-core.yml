name: CI - Core

on:
  push:
    branches:
      - v4.0
      - v5.0
    paths:
      - 'packages/core/**'
      - 'dev/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-core.yml'
  pull_request:
    branches:
      - v4.0
      - v5.0
    paths:
      - 'packages/core/**'
      - 'dev/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-core.yml'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome

      - name: Run build
        run: npm run build

      - name: Start dev server and run tests
        run: |
          # Start server in background
          dotnet run --project dev/Dev.csproj --urls "http://0.0.0.0:5000" &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s -o /dev/null -w '%{http_code}' --head http://127.0.0.1:5000 | grep -q "200"; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          # Run core tests
          npm run test:core
          TEST_EXIT=$?

          # Stop server
          echo "Stopping server (PID: $SERVER_PID)"
          kill $SERVER_PID || true

          # Exit with test result
          exit $TEST_EXIT
